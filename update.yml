name: Rebuild CFB Props

on:
      schedule:
    - cron: "7 13 * * *"            # 9:07 AM Eastern every day
    - cron: "37 12-22/2 * * 6"      # Saturdays: every 2 hours, 8:37 AM to 6:37 PM Eastern
    - cron: "43 19 * * 4,5"         # Thursday and Friday 3:43 PM Eastern
  workflow_dispatch: {}   # "Run workflow" button for a manual rebuild

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Past seasons never change, so keep them between runs
      - uses: actions/cache@v4
        with:
          path: data
          key: cfb-data-${{ github.run_id }}
          restore-keys: cfb-data-
      - run: python cfb_build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
